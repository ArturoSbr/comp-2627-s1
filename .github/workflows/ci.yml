name: Autograder CI

on:
  push:
    branches:
      - 'assignment-01/*'

jobs:
  autograding-assignment-01:
    name: Run Assignment 01 Autograder
    if: startsWith(github.ref, 'refs/heads/assignment-01/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13.15'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r grader-requirements.txt

      - name: Assignment 01 Autograder
        run: |
          echo "Triggered by a push to branch: ${{ github.ref_name }}"
          python assignments/assignment-01/code/grader.py

